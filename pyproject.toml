[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sun-earth-dro"
version = "0.1.0"
description = "Sun-Earth DRO phasing campaign and GMAT validation workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.9",
  "pillow>=10.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gmat: requires a working GmatConsole executable"]
